<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>

  <!-- Prevent theme flash: set data-theme before CSS paints -->
  <script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
  </script>

  <link rel="stylesheet" href="main.css" />
  <script defer src="theme.js"></script>
</head>
<body>
  <!-- Header: left = toggle + note, right = logo -->
  <header class="site-header" role="banner" aria-label="Unit header">
    <div class="header-controls">
      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-pressed="false" aria-label="Toggle dark mode">🌙 Dark</button>
      <p class="header-note">
        Use the 🌙/☀️ toggle to switch between night-friendly warm grey and a soft, light day theme.
      </p>
    </div>

    <img src="logo.svg" alt="Deakin" class="site-logo" />
  </header>

  <main class="container" role="main">
    <h1>SIT223-SIT753 - Professional Practice in IT</h1>
  </main>
</body>
</html>
